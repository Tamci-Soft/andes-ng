<h3 class="andes-accordion-trigger__heading">
  <button
    type="button"
    class="andes-accordion-trigger__button"
    [id]="triggerId"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="contentId"
    [disabled]="isDisabled()"
    (click)="onClick()"
  >
    <span class="andes-accordion-trigger__text"><ng-content /></span>
    <svg
      class="andes-accordion-trigger__icon"
      aria-hidden="true"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>
</h3>
