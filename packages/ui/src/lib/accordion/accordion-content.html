<div class="andes-accordion-content__inner">
  <div
    class="andes-accordion-content__body"
    [attr.data-size]="size()"
    [attr.data-variant]="variant()"
  >
    <ng-content />
    @if (lazy(); as lazy) { @if (shouldRenderLazy()) {
    <ng-container [ngTemplateOutlet]="lazy.templateRef" />
    } }
  </div>
</div>
