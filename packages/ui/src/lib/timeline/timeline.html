<ol
  class="andes-timeline"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
  [attr.aria-busy]="hasPending() ? 'true' : null"
>
  <ng-content />
  @if (hasPending()) {
  <andes-timeline-item [pending]="true" [dot]="pendingDot()" color="neutral">
    @if (pendingTemplate(); as template) {
    <ng-container *ngTemplateOutlet="template" />
    } @else if (pendingText()) {{{ pendingText() }}} @else {
    <span class="andes-timeline__ellipsis" aria-hidden="true"
      ><i></i><i></i><i></i
    ></span>
    <span class="andes-timeline__sr">{{ resolvedLabels().pending }}</span>
    }
  </andes-timeline-item>
  }
</ol>
