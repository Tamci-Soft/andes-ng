<andes-float-button
  class="andes-back-top__button"
  [type]="type()"
  [shape]="shape()"
  [size]="size()"
  [fixed]="fixed()"
  [right]="right()"
  [bottom]="bottom()"
  [left]="left()"
  [top]="top()"
  [tooltip]="tooltip()"
  [aria-label]="ariaLabel()"
  [attr.inert]="visible() ? null : ''"
  [attr.aria-hidden]="visible() ? null : 'true'"
  (click)="onClick($event)"
>
  <ng-content>
    <svg
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" />
    </svg>
  </ng-content>
</andes-float-button>
