<ng-template #inner>
  <span class="andes-menu__icon" aria-hidden="true"
    ><ng-content select="[slot=icon]" />@if (iconTemplate(); as tpl)
    {<ng-container [ngTemplateOutlet]="tpl" />} @else if (iconText(); as glyph)
    {{{ glyph }}}</span
  >
  <span class="andes-menu__short" aria-hidden="true">{{ shortLabel() }}</span>
  <span class="andes-menu__label" #labelEl
    ><ng-content />@if (labelTemplate(); as tpl) {<ng-container
      [ngTemplateOutlet]="tpl"
    />} @else if (labelString(); as text) {{{ text }}}</span
  >
  <span class="andes-menu__extra"
    ><ng-content select="[slot=extra]" />@if (extra(); as text) {{{ text
    }}}</span
  >
</ng-template>

<ng-template #view>
  @if (href(); as link) {
  <a
    class="andes-menu__row andes-menu__item"
    [andesMenuRow]="binding"
    [attr.href]="disabled() ? null : link"
    [attr.target]="target() ?? null"
    [attr.rel]="rel() ?? null"
    [style.--andes-menu-indent]="indent()"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </a>
  } @else {
  <div
    class="andes-menu__row andes-menu__item"
    [andesMenuRow]="binding"
    [style.--andes-menu-indent]="indent()"
  >
    <ng-container [ngTemplateOutlet]="inner" />
  </div>
  }
</ng-template>

@if (!overflowed()) {
<ng-container [ngTemplateOutlet]="view" />
}
