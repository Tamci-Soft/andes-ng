<div
  data-slot="alert"
  [attr.data-severity]="severity()"
  [attr.role]="resolvedRole()"
  [class]="classes()"
  [hidden]="!visible()"
>
  @if (showIcon()) {
  <span class="andes-alert__icon" aria-hidden="true">
    <!-- Stroked (outline) glyphs rather than solid/filled discs: at the 1rem size this layout
         calls for, a filled disc with a knocked-out mark collapses into a featureless colored
         dot, and the severity stops being readable from the glyph itself. An outline keeps the
         check / i / ! / x legible at 16px. All four share one 24-unit grid, one stroke width
         and one optical size so they read as a set. -->
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      @switch (severity()) { @case ('success') {
      <circle cx="12" cy="12" r="9" />
      <path d="m8.25 12.25 2.5 2.5 5-5.5" />
      } @case ('warning') {
      <path
        d="M10.3 4.6a2 2 0 0 1 3.4 0l7.3 12.6a2 2 0 0 1-1.7 3H4.7a2 2 0 0 1-1.7-3Z"
      />
      <path d="M12 10v3.5" />
      <path d="M12 16.75h.01" />
      } @case ('danger') {
      <circle cx="12" cy="12" r="9" />
      <path d="m14.5 9.5-5 5" />
      <path d="m9.5 9.5 5 5" />
      } @default {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11.25v5" />
      <path d="M12 7.75h.01" />
      } }
    </svg>
  </span>
  }

  <div class="andes-alert__title"><ng-content select="[slot=title]" /></div>
  <div class="andes-alert__description"><ng-content /></div>
  <div class="andes-alert__action"><ng-content select="[slot=action]" /></div>

  @if (closable()) {
  <button
    type="button"
    class="andes-alert__close"
    [attr.aria-label]="closeLabel()"
    (click)="dismiss()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="m6.5 6.5 11 11" />
      <path d="m17.5 6.5-11 11" />
    </svg>
  </button>
  }
</div>
