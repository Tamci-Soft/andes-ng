<ng-template #panel>
  <div
    andesOverlayContent
    class="andes-command-dialog"
    data-slot="command-dialog"
    [class]="panelClasses()"
    [attr.aria-label]="label()"
  >
    <andes-command
      [items]="items()"
      [(pages)]="pages"
      [(search)]="search"
      [(value)]="value"
      [shouldFilter]="shouldFilter()"
      [filter]="filter()"
      [loop]="loop()"
      [loading]="loading()"
      [highlight]="highlight()"
      [vimBindings]="vimBindings()"
      [placeholder]="placeholder()"
      [emptyText]="emptyText()"
      [loadingText]="loadingText()"
      [label]="label()"
      [backLabel]="backLabel()"
      [resultsLabel]="resultsLabel()"
      [itemTemplate]="itemTemplate()"
      (itemSelected)="onItemSelected($event)"
    />
  </div>
</ng-template>
