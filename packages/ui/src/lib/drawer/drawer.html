<ng-content select="[andesDrawerTrigger]" />

<ng-template #panel>
  <div
    andesOverlayContent
    class="andes-drawer__panel"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-describedby]="ariaDescribedBy()"
  >
    <button
      type="button"
      andesOverlayClose
      class="andes-drawer__close"
      aria-label="Close"
    >
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M6 6L18 18M18 6L6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <ng-content />
  </div>
</ng-template>
