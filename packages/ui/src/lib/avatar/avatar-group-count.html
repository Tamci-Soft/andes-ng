@if (interactive()) {
<!--
    A real <button>, not a tabindex'd host: the trigger has to be reachable by
    keyboard and expose a button role and an accessible name ("+N", its own
    text). With the default hover trigger this is the WAI-ARIA tooltip
    pattern - hover comes from the host (so the pointer can cross the chip's
    ring without flicker), focus/blur and Escape from the button, and a tap
    counts as a focus so touch users get the panel too. With trigger="click"
    it's a disclosure button instead (aria-expanded/aria-controls).
  -->
<button
  #triggerButton
  type="button"
  class="andes-avatar-group-count__trigger"
  [attr.aria-describedby]="!isClick() && open() ? panelId : null"
  [attr.aria-expanded]="isClick() ? open() : null"
  [attr.aria-controls]="isClick() && open() ? panelId : null"
  (focus)="onFocus()"
  (blur)="onFocusLeave($event)"
  (click)="onClick()"
  (keydown.escape)="onEscape(triggerButton)"
>
  {{ label() }}
</button>

@if (open()) {
<div
  [id]="panelId"
  [attr.role]="isClick() ? null : 'tooltip'"
  [attr.tabindex]="isClick() ? -1 : null"
  class="andes-avatar-group-count__panel"
  (focusout)="onFocusLeave($event)"
  (keydown.escape)="onEscape(triggerButton)"
>
  @if (panelTemplate(); as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="panelContext()"
  />
  } @else { @if (overflowLabel()) {
  <p class="andes-avatar-group-count__panel-label">{{ overflowLabel() }}</p>
  } @for (name of hiddenNames(); track $index) {
  <span class="andes-avatar-group-count__name">{{ name }}</span>
  } }
</div>
} } @else { {{ label() }} }
