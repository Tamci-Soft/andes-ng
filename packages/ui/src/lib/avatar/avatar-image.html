<img
  [src]="src()"
  [attr.srcset]="srcSet() || null"
  [attr.sizes]="sizes() || null"
  [attr.alt]="alt()"
  [attr.referrerpolicy]="referrerPolicy()"
  [attr.crossorigin]="crossOrigin()"
  [attr.draggable]="draggableAttr()"
  [hidden]="!state.showsImage()"
  (load)="onLoad()"
  (error)="onError($event)"
/>
