@for (region of regions(); track region.placement) {
<andes-toast-region
  flavor="notification"
  [placement]="region.placement"
  [toasts]="region.toasts"
  [controller]="toastService"
  [stack]="toastConfig().stack"
  [visibleToasts]="toastConfig().visibleToasts"
  [gap]="toastConfig().gap"
  [swipeDirections]="toastConfig().swipeDirections"
  [offset]="toastConfig().offset"
  [top]="toastConfig().top"
  [bottom]="toastConfig().bottom"
  [rtl]="toastConfig().rtl ?? false"
/>
} @if (messagesUsed()) {
<andes-toast-region
  flavor="message"
  placement="top-center"
  [toasts]="messages()"
  [controller]="messageService"
  [stack]="messageConfig().stack"
  [visibleToasts]="messageConfig().visibleToasts"
  [gap]="messageConfig().gap"
  [swipeDirections]="messageConfig().swipeDirections"
  [offset]="messageConfig().offset"
  [top]="messageConfig().top"
  [rtl]="messageConfig().rtl ?? false"
/>
}
