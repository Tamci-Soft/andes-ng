<div class="andes-toast__content">
  @if (toast().title) {
  <p class="andes-toast__title">{{ toast().title }}</p>
  }
  <p class="andes-toast__message">{{ toast().message }}</p>
</div>

@if (toast().action; as action) {
<button
  type="button"
  class="andes-toast__action"
  (click)="actionClicked.emit()"
>
  {{ action.label }}
</button>
} @if (toast().dismissible) {
<button
  type="button"
  class="andes-toast__close"
  aria-label="Dismiss notification"
  (click)="dismissRequested.emit()"
>
  <span aria-hidden="true">&times;</span>
</button>
}
