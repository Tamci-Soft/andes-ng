@for (option of normalizedOptions(); track option.value) {
<andes-tag
  checkable
  [class]="option.className ?? ''"
  [icon]="option.icon"
  [checked]="isSelected(option.value)"
  [disabled]="disabled() || !!option.disabled"
  (checkedChange)="toggle(option.value, $event)"
  >{{ option.label }}</andes-tag
>
}
