@if (isInteractive()) {
<button
  type="button"
  data-slot="tag"
  [class]="classes()"
  [disabled]="disabled()"
  [attr.aria-pressed]="checkable() ? checkedState() : null"
  (click)="onTagClick($event)"
>
  <ng-content select="[slot=icon]" />
  <ng-content />
</button>
} @else {
<span data-slot="tag" [class]="classes()">
  <ng-content select="[slot=icon]" />
  <ng-content />
  @if (closable()) {
  <button
    type="button"
    class="andes-tag__close"
    [disabled]="disabled()"
    [attr.aria-label]="closeAriaLabel()"
    (click)="onClose($event)"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <line x1="5" y1="5" x2="19" y2="19" />
      <line x1="19" y1="5" x2="5" y2="19" />
    </svg>
  </button>
  }
</span>
}
