<div
  #slider
  class="andes-rate__stars"
  data-slot="rate-stars"
  role="slider"
  [attr.id]="id() ?? null"
  [attr.tabindex]="isDisabled() ? -1 : 0"
  aria-valuemin="0"
  [attr.aria-valuemax]="total()"
  [attr.aria-valuenow]="current()"
  [attr.aria-valuetext]="valueText()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
  [attr.aria-describedby]="ariaDescribedby() ?? null"
  [attr.aria-invalid]="ariaInvalid() ? 'true' : null"
  [attr.aria-readonly]="readonly() ? 'true' : null"
  [attr.aria-disabled]="isDisabled() ? 'true' : null"
  (keydown)="onKeydown($event)"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
  (pointerleave)="onPointerLeave()"
  (pointermove)="onPointerMove($event)"
  (click)="onClick($event)"
>
  @for (index of stars(); track index) {
  <div
    class="andes-rate__star"
    data-slot="rate-star"
    [attr.data-state]="fill(index) >= 1 ? 'full' : fill(index) > 0 ? 'partial' : 'empty'"
    [attr.data-index]="index"
  >
    <div class="andes-rate__layer andes-rate__layer--empty" aria-hidden="true">
      <ng-container
        [ngTemplateOutlet]="glyph"
        [ngTemplateOutletContext]="{ index: index, filled: false }"
      />
    </div>
    <div
      class="andes-rate__layer andes-rate__layer--filled"
      aria-hidden="true"
      [style.inline-size.%]="fillPercent(index)"
    >
      <div class="andes-rate__glyph-box">
        <ng-container
          [ngTemplateOutlet]="glyph"
          [ngTemplateOutletContext]="{ index: index, filled: true }"
        />
      </div>
    </div>
    @if (tip(index); as text) {
    <span class="andes-rate__tip" data-slot="rate-tooltip" aria-hidden="true"
      >{{ text }}</span
    >
    }
  </div>
  }
</div>

<ng-template #glyph let-index="index" let-filled="filled">
  @if (template(); as custom) {
  <ng-container
    [ngTemplateOutlet]="custom"
    [ngTemplateOutletContext]="context(index, filled)"
  />
  } @else if (text(index) !== null) {
  <span class="andes-rate__text">{{ text(index) }}</span>
  } @else {
  <svg class="andes-rate__star-icon" viewBox="0 0 24 24" focusable="false">
    <path
      d="M12 2.6 14.9 8.7l6.6.9-4.8 4.6 1.2 6.6L12 17.7l-5.9 3.1 1.2-6.6-4.8-4.6 6.6-.9Z"
    />
  </svg>
  }
</ng-template>
