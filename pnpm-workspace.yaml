packages:
  - 'packages/*'

preferWorkspacePackages: true
linkWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - 'nx'
  - '@nx/*'
trustPolicy: no-downgrade

# GHSA-7w5x-hrqm-74c2 (nx's own dependency chain); nx hasn't bumped its pin yet.
# webpack-dev-middleware@7.4.6 failed pnpm's trust check (published to an abandoned line a year
# after the last release, no trust evidence) — pinned to 7.4.5 rather than trusting it.
overrides:
  'smol-toml@<1.7.1': '>=1.8.0'
  'webpack-dev-middleware@>=7.4.6 <8.0.0': '7.4.5'
