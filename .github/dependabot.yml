version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'develop'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'build(deps)'
    pull-request-branch-name:
      prefix: 'feature'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-*'
      nx:
        patterns:
          - '@nx/*'
          - 'nx'
      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      semver-major-days: 14

  # GitHub Actions versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'develop'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci(deps)'
    pull-request-branch-name:
      prefix: 'feature'
    groups:
      actions:
        patterns:
          - '*'
    cooldown:
      # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
      default-days: 5
