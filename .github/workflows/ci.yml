name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint and test
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') || github.head_ref == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Lint and test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pnpm exec nx affected -t lint test --parallel=3
          else
            pnpm lint
            pnpm test
          fi

  build:
    name: Build packages and Storybook
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') || github.head_ref == 'main')) }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybook

  verify:
    name: verify
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') || github.head_ref == 'main')) }}
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "format, lint, tests, packages and Storybook are green"
