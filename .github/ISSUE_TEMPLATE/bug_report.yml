name: Bug report
description: Report a defect in Andes NG
title: 'fix: <short description>'
labels: ['bug']
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched open and closed issues for a duplicate of this bug
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Package / area
      options:
        - tokens
        - ui
        - testing
        - playground
        - storybook
        - docs / adr
        - build / ci
        - unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Package name and version (e.g. @andes-ng/ui@0.0.1):
        - Angular version:
        - Browser / version:
        - OS:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console errors / screenshots
      render: shell
    validations:
      required: false

# Schema: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
